    <div class="mascote">

    </div>

    <h1>Ponto<br>a ponto</h1>

                     <div class="icon">
                    <img src="./src/assets/img/icon.png" alt="ICON ">

            </div>




      
    <section class="card">

        <div class="titulo-formulario">
            <h2>Registrar ocorrência</h2>
            <p>Ajude a melhorar sua cidade. Conte para nós o que aconteceu!</p>
        </div>

        <form action="" method="POST" enctype="multipart/form-data" class="formulario-ocorrencia">

            
            <div class="campos-formulario">
                <div class="campo">
                    <label for="categoria">Categoria do problema</label>

                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="buraco">Buraco na via</option>
                        <option value="iluminacao">Iluminação pública</option>
                        <option value="lixo">Acúmulo de lixo</option>
                        <option value="sinalizacao">Sinalização</option>
                        <option value="calcada">Calçada danificada</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="titulo">Título da ocorrência <span>*</span></label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ex: Buraco na via"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição <span>*</span></label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        placeholder="Conte mais detalhes sobre o problema..."
                        maxlength="500"
                        required
                    ></textarea>
                </div>

            </div>


            <div class="coluna">

                <label for="arquivo" class="botao-anexar">
                     Anexar arquivo <br>
                </label>
                <div class="anexar">
                <input
                    type="file"
                    id="arquivo"
                    name="arquivo"
                    accept="image/png,image/jpeg,application/pdf"
                >
                </div>
                <button type="submit">
                    Enviar ocorrência
                </button>

            </div>

        </form>

    </section>



</body>
